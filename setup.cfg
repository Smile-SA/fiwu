# ==============================================================================
# Provides fallback (ubuntu 22.04) configuration for distutils/setuptools commands
# that do not support pyproject.toml. Metadata here should match
# pyproject.toml to avoid conflicts during installation or building.
# ==============================================================================

[metadata]
name = fiwu
version = 1.0.0
description = Per-process egress firewall for Linux with UI prompts
long_description = file: README.md
long_description_content_type = text/markdown

# Detailed description included in package metadata.
summary =
    Fiwu intercepts outgoing network connections via NFQUEUE and prompts the user
    to allow or block each process on first contact. Supports permanent and
    session-only decisions with a tkinter GUI and a GNOME shell extension for
    quick enable/disable from the system menu.

# Source directory configuration.
[options]
package_dir =
    = src
packages = find:

[options.packages.find]
where = src

# Ensure static assets are included in the package distribution.
[options.package_data]
fiwu =
    config.json
    gui/extension/*

[options.entry_points]
# Map command-line names to Python functions.
console_scripts =
    fiwu = fiwu.cli:main
    fiwu-daemon = fiwu.fiwu:main