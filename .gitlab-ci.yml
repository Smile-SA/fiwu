stages:
  # Jobs in later stages wait for the preceding stage unless an explicit needs relationship applies.
  - build
  - test-configuration
  - test-service-management
  - benchmark
  - import-github-pr
  - deploy

variables:
  # Build Platform Toggle
  RUN_PLATFORM: 
    value: "all"
    options: ["all", "fedora", "ubuntu", "debian"]
    description: "Select specific OS or all"
    
  # Test Stage Toggles
  RUN_CONFIG:
    value: "true"
    options: ["true", "false"]
    description: "Run test-configuration stage?"
  RUN_SERVICE_MGMT:
    value: "true"
    options: ["true", "false"]
    description: "Run test-service-management stage?"

  # Benchmark Stage Toggles
  RUN_BENCHMARK:
    value: "true"
    options: ["true", "false"]
    description: "Run benchmark stage?"
  BENCHMARK_RATE:
    value: "10000"
    description: "Target Requests Per Second (RPS) limit for wrk load generator"

  BENCH_SKIP_QUEUE_CHECK: "1"
  DEBIAN_FRONTEND: "noninteractive"
  NEEDRESTART_MODE: "a"
  IS_UBUNTU: "false"
  DEB_BUILD_OPTIONS: "parallel=3"
  MAKEFLAGS: "-j3"
  RPM_BUILD_NCPUS: "3"
  KEEP_BUILD_ARTIFACTS: "1"

default:
  tags:
    - galaxy-dind-shared
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.shared_rules:
  skip_stages: &skip_stages
    if: >
      $CI_PIPELINE_SOURCE == "trigger" ||
      (($CI_COMMIT_BRANCH != "dev" || $CI_PIPELINE_SOURCE != "push") && (
        ($RUN_CONFIG == "false" && $CI_JOB_STAGE == "test-configuration") ||
        ($RUN_SERVICE_MGMT == "false" && $CI_JOB_STAGE == "test-service-management") ||
        ($RUN_BENCHMARK == "false" && $CI_JOB_STAGE == "benchmark")))
    when: never
    
  pause_pr: &pause_pr
    if: '$CI_COMMIT_BRANCH =~ /^gh-pr-/'
    when: manual

  manual_off_dev: &manual_off_dev
    if: '$CI_COMMIT_BRANCH != "dev" && $CI_PIPELINE_SOURCE != "schedule"'
    when: manual
    allow_failure: true

.fedora_job:
  rules:
    - *skip_stages
    - *pause_pr
    - if: '$RUN_PLATFORM != "all" && $RUN_PLATFORM != "fedora"'
      when: never
    - *manual_off_dev
    - when: on_success

.ubuntu_job:
  rules:
    - *skip_stages
    - *pause_pr
    - if: '$RUN_PLATFORM != "all" && $RUN_PLATFORM != "ubuntu"'
      when: never
    - *manual_off_dev
    - when: on_success

.debian_job:
  rules:
    - *skip_stages
    - *pause_pr
    - if: '$RUN_PLATFORM != "all" && $RUN_PLATFORM != "debian" && $RUN_PLATFORM != "ubuntu"'
      when: never
    - *manual_off_dev
    - when: on_success

.randomized_config:
  # Generates random configuration to test against protocols.
  randomized_config: &randomized_config
    - |
      chmod +x ./tests/random_config.sh
      ./tests/random_config.sh > ./tests/test_config.json

.tests_dependencies:
  # Installs only the tools needed by the network probes and handles both Debian and Fedora Distros.
  install_test_dependencies: &install_test_dependencies
  - |
    # Ubuntu / Debian
    if command -v apt-get >/dev/null 2>&1; then
      sleep $((RANDOM % 5 + 1))
      
      # Configure APT timeouts inline so network stalls fail in seconds instead of minutes
      APT_OPTS="-o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=1 -o Acquire::http::Pipeline-Depth=0"
      
      retry=0
      until [ "$retry" -ge 3 ]; do
        apt-get update -qq $APT_OPTS >/dev/null 2>&1 && break
        retry=$((retry+1))
        sleep $(( (2 ** retry) + (RANDOM % 3) ))
      done
      
      apt-get install -y -qq $APT_OPTS --no-install-recommends \
              jq nmap dnsutils netcat-openbsd iputils-ping openssl curl sudo >/dev/null 2>&1 || \
      { sleep 2 && apt-get install -y -qq $APT_OPTS --no-install-recommends jq nmap dnsutils netcat-openbsd iputils-ping openssl curl sudo >/dev/null 2>&1; }

    # Fedora
    elif command -v dnf >/dev/null 2>&1; then
      dnf install -y -q jq nmap bind-utils netcat iputils openssl curl sudo
    fi

.start_fiwu:
  # Starts the fiwu daemon in the background.
  start: &start_fiwu
    - |
      command -v pgrep >/dev/null 2>&1 || { apt-get install -y -qq procps || dnf install -y -q procps-ng; }
      UNIT=$(ls /usr/lib/systemd/system/fiwu.service /lib/systemd/system/fiwu.service 2>/dev/null | head -1)
      [ -n "$UNIT" ] || { echo "fiwu.service unit not found in package" >&2; exit 1; }
      EXEC=$(grep -m1 '^ExecStart=' "$UNIT" | sed -E 's/^ExecStart=[-@+!:]*//')
      echo "Starting daemon: $EXEC"
      nohup sh -c "exec $EXEC" >/tmp/fiwu.log 2>&1 &
      FIWU_PID=$!
      sleep 3
      echo "--- fiwu log (tail) ---"; tail -n 20 /tmp/fiwu.log
      BIN=$(basename "${EXEC%% *}")
      kill -0 "$FIWU_PID" 2>/dev/null || pgrep -x "$BIN" >/dev/null || { echo "fiwu daemon is not running" >&2; exit 1; }

# Build one package per OS_TAG. Build jobs publish only the package format that
# their downstream tests install; dist/ itself remains an ephemeral workspace.
# Build baseline packages (forward-compatible across target OS releases)
debian:
  stage: build
  rules:
    - *skip_stages
    - *pause_pr
    - if: '$RUN_PLATFORM == "all" || $RUN_PLATFORM == "debian" || $RUN_PLATFORM == "ubuntu"'
      when: on_success
    - when: never
  image: debian:12
  before_script:
    - mkdir -p dist
  script:
    - ./install.sh --build-local
  artifacts:
    paths:
      - dist/*.deb
    expire_in: 1 day
  parallel:
    matrix:
      - OS_TAG: debian12

fedora:
  stage: build
  rules:
    - *skip_stages
    - *pause_pr
    - if: '$RUN_PLATFORM == "all" || $RUN_PLATFORM == "fedora"'
      when: on_success
    - when: never
  image: fedora:43
  before_script:
    - mkdir -p dist
  script:
    - ./install.sh --build-local
  artifacts:
    paths:
      - dist/*.rpm
    expire_in: 1 day
  parallel:
    matrix:
      - OS_TAG: fedora43

# Test Extension verify installation of gnome extension, contents and permissions.
ubuntu:gnome_extension:
  extends: .ubuntu_job
  stage: test-service-management
  image: $OS_TAG
  needs:
    - job: debian
      artifacts: true
  before_script:
    - test -n "$(ls dist/*.deb 2>/dev/null)" || (echo "Missing .deb package in dist/" >&2; exit 1)
    - apt-get update -qq && apt-get install -y ./dist/fiwu_*.deb
    - chmod +x ./tests/test_extension.sh
  script:
    - ./tests/test_extension.sh
  parallel:
    matrix:
      - OS_TAG: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]

debian:gnome_extension:
  extends: .debian_job
  stage: test-service-management
  image: $OS_TAG
  needs:
    - job: debian
      artifacts: true
  before_script:
    - test -n "$(ls dist/*.deb 2>/dev/null)" || (echo "Missing .deb package in dist/" >&2; exit 1)
    - apt-get update -qq && apt-get install -y ./dist/fiwu_*.deb
    - chmod +x ./tests/test_extension.sh
  script:
    - ./tests/test_extension.sh
  parallel:
    matrix:
      - OS_TAG: ["debian:12", "debian:13"]

fedora:gnome_extension:
  extends: .fedora_job
  stage: test-service-management
  image: $OS_TAG
  needs:
    - job: fedora
      artifacts: true
  before_script:
    - test -n "$(ls dist/*.rpm 2>/dev/null)" || (echo "Missing .rpm for ${OS_TAG}" >&2; exit 1)
    - dnf install -y ./dist/*.rpm
    - chmod +x ./tests/test_extension.sh
  script:
    - ./tests/test_extension.sh
  parallel:
    matrix:
      - OS_TAG: ["fedora:43"]

# Configuration-tests
ubuntu:configuration:
  extends: .ubuntu_job
  stage: test-configuration
  image: $OS_TAG
  needs:
    - job: debian
      artifacts: true
  before_script:
    - test -n "$(ls dist/*.deb 2>/dev/null)" || (echo "Missing .deb package in dist/" >&2; exit 1)
    - apt-get update -qq && apt-get install -y ./dist/fiwu_*.deb
    - *install_test_dependencies
    - *randomized_config
    - chmod +x ./tests/test_configuration.sh
    - fiwu -g dev || true
    - *start_fiwu
  script:
    - ./tests/test_configuration.sh
  after_script:
    - sort /tmp/fiwu.log | uniq -c | sort -rn | head -7 || true
  parallel:
    matrix:
      - OS_TAG: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]

debian:configuration:
  extends: .debian_job
  stage: test-configuration
  image: $OS_TAG
  needs:
    - job: debian
      artifacts: true
  before_script:
    - test -n "$(ls dist/*.deb 2>/dev/null)" || (echo "Missing .deb package in dist/" >&2; exit 1)
    - apt-get update -qq && apt-get install -y ./dist/fiwu_*.deb
    - *install_test_dependencies
    - *randomized_config
    - chmod +x ./tests/test_configuration.sh
    - fiwu -g dev || true
    - *start_fiwu
  script:
    - ./tests/test_configuration.sh
  after_script:
    - sort /tmp/fiwu.log | uniq -c | sort -rn | head -7 || true
  parallel:
    matrix:
      - OS_TAG: ["debian:12", "debian:13"]

fedora:configuration:
  extends: .fedora_job
  stage: test-configuration
  image: $OS_TAG
  needs:
    - job: fedora
      artifacts: true
  before_script:
    - test -n "$(ls dist/*.rpm 2>/dev/null)" || (echo "Missing .rpm for ${OS_TAG}" >&2; exit 1)
    - dnf install -y ./dist/*.rpm
    - *install_test_dependencies
    - *randomized_config
    - chmod +x ./tests/test_configuration.sh
    - fiwu -g dev || true
    - *start_fiwu
  script:
    - ./tests/test_configuration.sh
  after_script:
    - sort /tmp/fiwu.log | uniq -c | sort -rn | head -7 || true
  parallel:
    matrix:
      - OS_TAG: ["fedora:43"]

# Benchmark tests run in isolated hardware to avoid interference from other jobs.
ubuntu:benchmark:
  extends: .ubuntu_job
  stage: benchmark
  tags:
    - $OS_TAG
  resource_group: benchmark_hardware_lock
  needs:
    - job: debian
      artifacts: true
  before_script:
    - apt-get update -qq && apt-get install -y ./dist/fiwu_*.deb iperf3 jq curl iproute2 nginx wrk
    - chmod +x ./tests/benchmark.sh
  script:
    - ./tests/benchmark.sh
  artifacts:
    paths:
      - benchmark_results_*.json
    when: always
    expire_in: 1 week
  parallel:
    matrix:
      - OS_TAG: ["lxc:ubuntu22.04", "lxc:ubuntu24.04", "lxc:ubuntu26.04"]

debian:benchmark:
  stage: benchmark
  tags:
    - $OS_TAG
  resource_group: benchmark_hardware_lock
  needs:
    - job: debian
      artifacts: true
  before_script:
    - apt-get update -qq && apt-get install -y ./dist/fiwu_*.deb iperf3 jq curl iproute2 nginx wrk
    - chmod +x ./tests/benchmark.sh
  script:
    - ./tests/benchmark.sh
  artifacts:
    paths:
      - benchmark_results_*.json
    when: always
    expire_in: 1 week
  rules:
    - *skip_stages
    - *pause_pr
    - if: '$RUN_PLATFORM != "all" && $RUN_PLATFORM != "debian"'
      when: never
    - *manual_off_dev
    - when: on_success
  parallel:
    matrix:
      - OS_TAG: ["lxc:debian12", "lxc:debian13"]

fedora:benchmark:
  extends: .fedora_job
  stage: benchmark
  tags:
    - $OS_TAG
  resource_group: benchmark_hardware_lock
  needs:
    - job: fedora
      artifacts: true
  before_script:
    - dnf install -y ./dist/*.rpm iperf3 jq curl iproute nginx make gcc openssl-devel git perl-core
    - rm -rf /tmp/wrk-src && git clone --depth 1 https://github.com/wg/wrk.git /tmp/wrk-src && make -C /tmp/wrk-src -j1 && install -m 0755 /tmp/wrk-src/wrk /usr/local/bin/wrk && rm -rf /tmp/wrk-src
    - chmod +x ./tests/benchmark.sh
  script:
    - ./tests/benchmark.sh
  artifacts:
    paths:
      - benchmark_results_*.json
    when: always
    expire_in: 1 week
  parallel:
    matrix:
      - OS_TAG: ["lxc:fedora43"]

bundle:benchmark:
  stage: benchmark
  image: python:3-alpine
  needs:
    - job: ubuntu:benchmark
      optional: true
      artifacts: true
    - job: debian:benchmark
      optional: true
      artifacts: true
    - job: fedora:benchmark
      optional: true
      artifacts: true
  rules:
    - *skip_stages
    - *pause_pr
    - when: on_success
  script:
    - |
      python3 -c '
      import glob, json
      out = {}
      for p in sorted(glob.glob("benchmark_results_*.json")):
          try:
              out.update(json.load(open(p)))
          except Exception:
              pass
      json.dump(out, open("benchmark_summary.json", "w"), indent=2)
      '
  artifacts:
    paths:
      - benchmark_summary.json
    when: always
    expire_in: 30 days

# Uploads the tested .deb/.rpm to GitLab Package Registry and pushes to GitHub Releases.
release:github:
  stage: deploy
  needs:
    - job: sync:main
    - job: debian
      artifacts: true
    - job: fedora
      artifacts: true
    - job: ubuntu:gnome_extension
    - job: debian:gnome_extension
    - job: fedora:gnome_extension
    - job: ubuntu:configuration
    - job: debian:configuration
    - job: fedora:configuration
  image: debian:12
  script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates
    - PKG_VERSION=$(dpkg-deb -f "$(ls dist/fiwu_*.deb | head -1)" Version | sed 's/[^A-Za-z0-9._-]/-/g')
    - 'echo "Package version: ${PKG_VERSION}"'
    # Registry upload only for manual releases
    - |
      if [ "$CI_PIPELINE_SOURCE" != "schedule" ]; then
        for f in dist/*.deb dist/*.rpm; do
          [ -e "$f" ] || continue
          name=$(basename "$f")
          curl --silent --fail --request PUT \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --upload-file "$f" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/fiwu/${PKG_VERSION}/${name}"
          echo "Published: ${name} -> generic/fiwu/${PKG_VERSION}/${name}"
        done
      fi
    # Install GitHub CLI
    - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
    - apt-get update -qq && apt-get install -y -qq gh
    - export GH_TOKEN="$GITHUB_TOKEN"
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then
        gh release delete "v${PKG_VERSION}" --cleanup-tag --yes --repo "$GITHUB_REPO_PATH" || true
      fi
    - |
      gh release create "v${PKG_VERSION}" dist/*.deb dist/*.rpm \
        --repo "$GITHUB_REPO_PATH" --target main \
        --title "Release v${PKG_VERSION}" \
      || gh release upload "v${PKG_VERSION}" dist/*.deb dist/*.rpm --repo "$GITHUB_REPO_PATH" --clobber
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: '$RUN_PLATFORM != "all" || $RUN_CONFIG != "true" || $RUN_SERVICE_MGMT != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual

# Sync GitHub PRs as GitLab Merge Requests
sync:github:prs:
  stage: import-github-pr
  image: debian:12
  variables:
    GIT_DEPTH: 0
    BOT_NAME: "FIWU CI Bot"
    BOT_EMAIL: "fiwu-ci-bot@noreply.${CI_SERVER_HOST}"
  script:
    - apt-get update -qq && apt-get install -y -qq git curl jq
    - git config user.name "$BOT_NAME"
    - git config user.email "$BOT_EMAIL"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch origin dev main
    - |
      curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
        "https://api.github.com/repos/${GITHUB_REPO_PATH}/pulls?state=open&per_page=100" \
        | jq -r '.[].number' > open_prs.txt
    - |
      while read -r pr_num; do
        branch="gh-pr-${pr_num}"
        git fetch "https://github.com/${GITHUB_REPO_PATH}.git" "+refs/pull/${pr_num}/head:refs/heads/${branch}"
        git push -f origin "$branch" \
          -o ci.skip \
          -o merge_request.create \
          -o merge_request.target=dev \
          -o "merge_request.title=GitHub PR #${pr_num}"
      done < open_prs.txt
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $ENABLE_PR_SYNC == "true"'
  
# Sync main branch: filtered copy of dev without .gitlab-ci.yml (fast-forward only)
sync:main:
  stage: deploy
  image: debian:12
  variables:
    GIT_STRATEGY: none
  script:
    - apt-get update -qq && apt-get install -y -qq git git-filter-repo
    - |
      set -eu
      git clone -q --single-branch --branch dev \
        "https://oauth2:${MAIN_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" /tmp/fiwu-filtered
      cd /tmp/fiwu-filtered
      git filter-repo --quiet --invert-paths --path .gitlab-ci.yml
      git remote add origin "https://oauth2:${MAIN_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      if [ -n "$(git log --all --oneline -- .gitlab-ci.yml)" ]; then
        echo "CI file still in filtered history, not pushing" >&2; exit 1
      fi
      git fetch -q origin main
      if ! git merge-base --is-ancestor origin/main HEAD; then
        echo "main has diverged from filtered dev, not pushing" >&2; exit 1
      fi
      git push origin HEAD:main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: '$CI_COMMIT_BRANCH != "dev"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: manual
      allow_failure: true