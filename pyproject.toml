# ==============================================================================
# Defines project metadata, dependencies, and build system settings
# using PEP 621 standard. This file is the primary source of truth
# for Python packaging tools like `build` and `pip`.
# ==============================================================================

# Specifies the build backend. setuptools>=61.0 supports PEP 621 metadata natively.
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fiwu"
version = "1.0.0"
description = "Per-process egress firewall for Linux with UI prompts"
readme = "README.md"
requires-python = ">=3.8"

# Runtime dependencies required for Fiwu to operate.
dependencies = [
    "scapy",      # For packet sniffing and manipulation
    "psutil"      # For process information and system monitoring
]

# Entry points for console commands installed by pip.
[project.scripts]
fiwu = "fiwu.cli:main"       # CLI entry point for user interaction
fiwu-daemon = "fiwu.fiwu:main" # Daemon entry point for background service

# Reference for setuptools to find the source packages.
[tool.setuptools.packages.find]
where = ["src"]

# Include non-Python assets (config and extension files) in the wheel/sdist.
[tool.setuptools.package-data]
fiwu = ["config.json", "gui/extension/*"]